# KEC GIS Platform — local/dev stack.
# Run:  docker compose up -d
# Then: docker compose run --rm loader   (loads data/plots.geojson into PostGIS)
# The web app runs separately:  cd ../apps/web && npm install && npm run dev
name: kec-gis

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: kec_gis
      POSTGRES_USER: kec
      POSTGRES_PASSWORD: kec_dev_pw
    ports: ['5432:5432']
    volumes:
      - ./volumes/pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kec -d kec_gis']
      interval: 5s
      timeout: 5s
      retries: 20

  martin:
    image: ghcr.io/maplibre/martin:latest
    depends_on:
      postgis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://kec:kec_dev_pw@postgis:5432/kec_gis
    command: ['--config', '/config.yaml']
    volumes:
      - ./martin/config.yaml:/config.yaml:ro
    ports: ['3001:3000']

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kec
      MINIO_ROOT_PASSWORD: kec_dev_pw
    ports: ['9000:9000', '9001:9001']
    volumes:
      - ./volumes/minio:/data

  api:
    build: ../apps/api
    depends_on:
      postgis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://kec:kec_dev_pw@postgis:5432/kec_gis
      REDIS_URL: redis://redis:6379
      PORT: '3000'
    ports: ['3000:3000']

  # One-shot: load data/plots.geojson into PostGIS using GDAL.
  loader:
    image: ghcr.io/osgeo/gdal:alpine-small-latest
    profiles: ['tools']
    depends_on:
      postgis: { condition: service_healthy }
    working_dir: /work
    volumes:
      - ../data:/work/data:ro
      - ../scripts/etl:/work/etl:ro
    entrypoint: ['sh', '/work/etl/load-postgis.sh']
    environment:
      PGHOST: postgis
      PGPORT: '5432'
      PGDATABASE: kec_gis
      PGUSER: kec
      PGPASSWORD: kec_dev_pw

  # Optional identity provider (enable in V2)
  # keycloak:
  #   image: quay.io/keycloak/keycloak:latest
  #   command: ['start-dev']
  #   environment: { KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin }
  #   ports: ['8080:8080']
