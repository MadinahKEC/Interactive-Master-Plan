<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>مدينة المعرفة الاقتصادية — المخطط العام التفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --kec-green:#2F6B3E; --kec-title:#1C6034; --kec-green-deep:#143D1E;
  --kec-gold:#9A8A1E; --kec-olive:#7E6F1B;
  --kec-ink:#16221B; --kec-muted:#5C6B60;
  --kec-paper:#FBFCFA; --kec-surface:#F0F5EC; --kec-surface-2:#EAF3E4; --kec-hairline:#E4EBDF;
  --kec-pos:#2F6B3E; --kec-neg:#B5462F; --kec-info:#2E7D6B; --kec-warn:#9A8A1E;
  --kec-font:'Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;
  --kec-mono:'IBM Plex Mono',ui-monospace,monospace;
  --shadow:0 6px 22px rgba(20,61,30,.10),0 1px 3px rgba(20,61,30,.08);
  --shadow-lg:0 18px 50px rgba(20,61,30,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--kec-font);color:var(--kec-ink);background:var(--kec-paper);overflow:hidden}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-family:var(--kec-font);font-size:9px;opacity:.7}

/* ---- Top bar ---- */
#topbar{position:absolute;top:0;left:0;right:0;height:60px;z-index:20;display:flex;align-items:center;
  gap:16px;padding:0 18px;background:rgba(251,252,250,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--kec-hairline);box-shadow:0 2px 12px rgba(20,61,30,.05)}
.brand{display:flex;align-items:center;gap:11px}
.brand svg{width:34px;height:34px;flex:none}
.brand .txt b{display:block;font-size:14.5px;font-weight:700;color:var(--kec-title);line-height:1.15}
.brand .txt span{display:block;font-size:10px;color:var(--kec-muted);letter-spacing:.02em}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--kec-surface);border:1px solid var(--kec-hairline);
  border-radius:11px;padding:3px;gap:2px}
.seg button{font-family:inherit;font-size:12px;font-weight:500;color:var(--kec-muted);background:transparent;
  border:0;border-radius:8px;padding:7px 14px;cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--kec-ink)}
.seg button.on{background:#fff;color:var(--kec-title);box-shadow:0 1px 3px rgba(20,61,30,.12);font-weight:600}
.seg-label{font-size:10px;color:var(--kec-muted);margin-inline-end:6px;align-self:center}
.tb-group{display:flex;align-items:center;gap:8px}

/* ---- Control panel (right) ---- */
.panel{position:absolute;z-index:15;background:rgba(251,252,250,.96);backdrop-filter:blur(10px);
  border:1px solid var(--kec-hairline);border-radius:16px;box-shadow:var(--shadow)}
#controls{top:74px;right:14px;width:290px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;overflow:hidden}
.ctl-scroll{overflow-y:auto;padding:14px 14px 16px}
.ctl-scroll::-webkit-scrollbar{width:8px}
.ctl-scroll::-webkit-scrollbar-thumb{background:var(--kec-hairline);border-radius:4px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--kec-hairline);
  border-radius:11px;padding:9px 12px;margin-bottom:14px}
.search input{border:0;outline:0;flex:1;font-family:var(--kec-mono);font-size:13px;color:var(--kec-ink);background:transparent}
.search svg{width:16px;height:16px;color:var(--kec-muted);flex:none}
.sect-title{font-size:10.5px;font-weight:600;color:var(--kec-muted);letter-spacing:.06em;
  text-transform:uppercase;margin:4px 0 9px;display:flex;align-items:center;justify-content:space-between}
.sect-title .mini{font-family:var(--kec-mono);color:var(--kec-title);font-weight:500;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-size:11.5px;font-weight:500;color:var(--kec-muted);background:var(--kec-surface);
  border:1px solid var(--kec-hairline);border-radius:20px;padding:5px 12px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--kec-green)}
.chip.on{background:var(--kec-green);color:#fff;border-color:var(--kec-green)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--kec-hairline);border-radius:12px;padding:11px 12px}
.kpi .v{font-size:19px;font-weight:700;color:var(--kec-title);font-family:var(--kec-mono);line-height:1.1}
.kpi .l{font-size:10px;color:var(--kec-muted);margin-top:3px}

/* Legend */
.legend{display:flex;flex-direction:column;gap:2px}
.lg{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:8px;cursor:pointer;transition:.12s}
.lg:hover{background:var(--kec-surface)}
.lg.off{opacity:.34}
.lg .sw{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.12)}
.lg .nm{font-size:11.5px;color:var(--kec-ink);flex:1;line-height:1.25}
.lg .ct{font-size:10px;color:var(--kec-muted);font-family:var(--kec-mono)}

/* ---- Detail panel (left) ---- */
#detail{top:74px;left:14px;width:326px;max-height:calc(100vh - 90px);display:none;flex-direction:column;overflow:hidden}
#detail.show{display:flex;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.d-head{background:linear-gradient(135deg,var(--kec-title),var(--kec-green-deep));color:#fff;padding:16px 18px;position:relative}
.d-head .code{font-family:var(--kec-mono);font-size:24px;font-weight:600;letter-spacing:.02em}
.d-head .lu{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;
  background:rgba(255,255,255,.16);padding:4px 11px;border-radius:20px}
.d-head .lu .dot{width:9px;height:9px;border-radius:50%;flex:none}
.d-close{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:8px;border:0;cursor:pointer;
  background:rgba(255,255,255,.15);color:#fff;font-size:16px;line-height:1;transition:.15s}
.d-close:hover{background:rgba(255,255,255,.28)}
.d-body{padding:8px 10px 14px;overflow-y:auto}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px}
.d-cell{background:var(--kec-surface);border:1px solid var(--kec-hairline);border-radius:11px;padding:11px 12px}
.d-cell.full{grid-column:1 / -1}
.d-cell .l{font-size:10px;color:var(--kec-muted);margin-bottom:4px}
.d-cell .v{font-size:16px;font-weight:600;color:var(--kec-ink);font-family:var(--kec-mono)}
.d-cell .v.sm{font-size:13px;font-family:var(--kec-font)}
.d-actions{display:flex;gap:8px;padding:6px 8px 2px}
.btn{flex:1;font-family:inherit;font-size:12.5px;font-weight:600;border-radius:10px;padding:10px;cursor:pointer;
  border:1px solid var(--kec-hairline);background:#fff;color:var(--kec-title);transition:.15s;display:flex;
  align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--kec-surface-2)}
.btn.primary{background:var(--kec-green);color:#fff;border-color:var(--kec-green)}
.btn.primary:hover{background:var(--kec-green-deep)}
.note{font-size:10px;color:var(--kec-muted);text-align:center;padding:8px 10px 0}

/* hover tooltip */
.maplibregl-popup-content{font-family:var(--kec-font);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);border:1px solid var(--kec-hairline)}
.tip b{font-family:var(--kec-mono);color:var(--kec-title);font-size:13px}
.tip span{display:block;font-size:10.5px;color:var(--kec-muted);margin-top:2px}
.maplibregl-popup-tip{display:none}

/* loading */
#load{position:absolute;inset:0;z-index:40;background:var(--kec-paper);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#load .ring{width:38px;height:38px;border:3px solid var(--kec-surface-2);border-top-color:var(--kec-green);border-radius:50%;animation:spin 1s linear infinite}
#load p{font-size:12px;color:var(--kec-muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.credit{position:absolute;bottom:6px;right:14px;z-index:10;font-size:9px;color:var(--kec-muted);opacity:.7}
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div class="brand">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M24 3C13 8 7 17 7 27c0 9 6 16 17 18 11-2 17-9 17-18 0-10-6-19-17-24Z" fill="#2F6B3E"/>
      <path d="M24 3C13 8 7 17 7 27c0 4 1 7 3 10 3-13 8-23 14-34Z" fill="#1C6034"/>
      <path d="M24 10c-5 8-8 17-8 26 3 4 8 6 8 6s5-2 8-6c0-9-3-18-8-26Z" fill="#3E8E4F"/>
      <path d="M13 34c6 5 16 5 22 0" stroke="#9A8A1E" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="txt"><b>مدينة المعرفة الاقتصادية</b><span>Knowledge Economic City — المخطط العام التفاعلي</span></div>
  </div>
  <div class="spacer"></div>
  <div class="tb-group">
    <span class="seg-label">الخلفية</span>
    <div class="seg" id="basemapSeg">
      <button data-base="light" class="on">فاتح</button>
      <button data-base="satellite">قمر صناعي</button>
    </div>
  </div>
  <div class="tb-group">
    <span class="seg-label">العرض</span>
    <div class="seg" id="dimSeg">
      <button data-dim="2d" class="on">2D</button>
      <button data-dim="3d">مجسّم 3D</button>
    </div>
  </div>
  <button class="seg" id="resetBtn" style="cursor:pointer"><button style="pointer-events:none">إعادة الضبط ⟲</button></button>
</div>

<div class="panel" id="controls">
  <div class="ctl-scroll">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="ابحث برمز البلوت… مثل S19" autocomplete="off" />
    </div>

    <div class="sect-title">القطاعات <span class="mini" id="sectorMini"></span></div>
    <div class="chips" id="sectorChips"></div>

    <div class="kpis" id="kpis"></div>

    <div class="sect-title">الاستخدامات <span class="mini">اضغط للتصفية</span></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<div class="panel" id="detail"></div>

<div class="credit">© مدينة المعرفة الاقتصادية · بيانات المخطط: GIS KEC (958 بلوت)</div>
<div id="load"><div class="ring"></div><p>جارٍ تحميل المخطط العام…</p></div>

<script>
/* ==== PLOTS DATA (injected) ==== */
const PLOTS = /*__PLOTS_DATA__*/ null /*__END_PLOTS__*/;

/* ==== Land-use catalogue: color + Arabic label ==== */
const LU = {
  "Low/Med Density Residential":              {ar:"سكني منخفض/متوسط الكثافة", c:"#F2D8A7"},
  "Medium Density Residential":               {ar:"سكني متوسط الكثافة",       c:"#E9C583"},
  "High Density Residential & Commercial":    {ar:"سكني تجاري عالي الكثافة",  c:"#E39A54"},
  "Low/Med Density Residential & Commercial": {ar:"سكني تجاري منخفض/متوسط",   c:"#EDC58C"},
  "Medium Density Residential & Commercial":  {ar:"سكني تجاري متوسط الكثافة", c:"#E3B36B"},
  "High Density Mixed-Use":                   {ar:"استخدام مختلط عالي الكثافة",c:"#D97E4E"},
  "Medium Density Mixed-Use":                 {ar:"استخدام مختلط متوسط",      c:"#E0A277"},
  "Commercial":                               {ar:"تجاري",                   c:"#C85C4E"},
  "Cultural & Commercial":                    {ar:"ثقافي وتجاري",            c:"#B5588F"},
  "Offices":                                  {ar:"مكاتب",                   c:"#8A6D4F"},
  "Hospitality":                              {ar:"ضيافة",                   c:"#9C6BB0"},
  "Medical":                                  {ar:"طبي",                     c:"#D06B84"},
  "Education":                                {ar:"تعليمي",                  c:"#5B8FB0"},
  "Community Facilities":                     {ar:"مرافق مجتمعية",           c:"#4FA5A0"},
  "Open Space":                               {ar:"مساحات مفتوحة",           c:"#88BF6A"},
  "Utilities":                                {ar:"مرافق وبنية تحتية",       c:"#9AA0A6"},
  "Train station and reservation":            {ar:"محطة قطار ومحمية",        c:"#6D7B8A"}
};
const LU_FALLBACK = "#C9C9C9";
const SECTORS = {North:"شمال", South:"جنوب", Central:"وسط", East:"شرق", West:"غرب"};
const nf = new Intl.NumberFormat('en-US');
const nf1 = new Intl.NumberFormat('en-US',{maximumFractionDigits:1});

/* build MapLibre 'match' color expression from LU */
function luColorExpr(){
  const e = ["match", ["get","land_use"]];
  for (const k in LU){ e.push(k, LU[k].c); }
  e.push(LU_FALLBACK);
  return e;
}

/* ---- Base style with two raster basemaps + plots source ---- */
const style = {
  version: 8,
  glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
  sources: {
    carto: { type:"raster", tiles:["https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png","https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}@2x.png"], tileSize:256, attribution:"© OpenStreetMap © CARTO" },
    esri:  { type:"raster", tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize:256, attribution:"© Esri World Imagery" },
    plots: { type:"geojson", data: PLOTS, promoteId:"code" }
  },
  layers: [
    { id:"bg", type:"background", paint:{"background-color":"#EAF3E4"} },
    { id:"base-light", type:"raster", source:"carto", paint:{"raster-opacity":1} },
    { id:"base-sat",   type:"raster", source:"esri",  layout:{visibility:"none"} },
    { id:"plots-fill", type:"fill", source:"plots",
      paint:{ "fill-color":luColorExpr(),
              "fill-opacity":["case",["boolean",["feature-state","hover"],false],0.92,0.66] } },
    { id:"plots-line", type:"line", source:"plots",
      paint:{ "line-color":"#143D1E",
              "line-width":["interpolate",["linear"],["zoom"],12,0.3,15,0.7,18,1.4],
              "line-opacity":0.55 } },
    { id:"plots-sel", type:"line", source:"plots",
      paint:{ "line-color":"#9A8A1E","line-width":3,"line-opacity":1 },
      filter:["==","code",""] },
    { id:"plots-3d", type:"fill-extrusion", source:"plots", layout:{visibility:"none"},
      paint:{ "fill-extrusion-color":luColorExpr(),
              "fill-extrusion-height":["coalesce",["get","height"],["*",["coalesce",["get","floors"],1],3]],
              "fill-extrusion-opacity":0.9 } },
    { id:"plots-label", type:"symbol", source:"plots", minzoom:15.2,
      layout:{ "text-field":["get","code"], "text-font":["Open Sans Regular"], "text-size":10, "text-allow-overlap":false },
      paint:{ "text-color":"#143D1E","text-halo-color":"#FBFCFA","text-halo-width":1.4 } }
  ]
};

const map = new maplibregl.Map({
  container:"map", style, center:[39.678995,24.469588], zoom:14.2, pitch:0, bearing:-8,
  maxZoom:19, attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl({showZoom:true,showCompass:true}), "bottom-left");
map.addControl(new maplibregl.ScaleControl({unit:"metric"}), "bottom-left");

const BOUNDS = [[39.65693,24.45448],[39.70106,24.48469]];

/* ---- Filter state ---- */
const state = { sector:"all", uses:new Set(Object.keys(LU)), search:"" };

function predicate(p){
  if (state.sector!=="all" && p.sector!==state.sector) return false;
  if (!state.uses.has(p.land_use)) return false;
  if (state.search){ const s=state.search.toUpperCase(); if(!(p.code||"").toUpperCase().includes(s)) return false; }
  return true;
}
function mlFilter(){
  const parts=["all"];
  if(state.sector!=="all") parts.push(["==",["get","sector"],state.sector]);
  const useList=[...state.uses];
  if(useList.length<Object.keys(LU).length) parts.push(["in",["get","land_use"],["literal",useList]]);
  if(state.search) parts.push(["in", state.search.toUpperCase(), ["upcase",["coalesce",["get","code"],""]]]);
  return parts.length===1 ? null : parts;
}
function applyFilter(){
  const f=mlFilter();
  ["plots-fill","plots-line","plots-3d","plots-label"].forEach(l=>map.setFilter(l, f));
  updateKpis();
}

/* ---- KPIs ---- */
function updateKpis(){
  let n=0,gfa=0,area=0; const uses=new Set();
  for(const ft of PLOTS.features){ const p=ft.properties; if(!predicate(p))continue; n++; gfa+=p.gfa||0; area+=p.area||0; uses.add(p.land_use); }
  document.getElementById("kpis").innerHTML =
    kpi(nf.format(n),"عدد البلوت") + kpi(uses.size,"عدد الاستخدامات") +
    kpi(fmtBig(gfa),"إجمالي GFA (م²)") + kpi(fmtBig(area),"إجمالي المساحة (م²)");
}
function kpi(v,l){ return `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`; }
function fmtBig(x){ if(x>=1e6) return nf1.format(x/1e6)+"M"; if(x>=1e3) return nf1.format(x/1e3)+"K"; return nf.format(Math.round(x)); }

/* ---- Build sidebar ---- */
function buildSectors(){
  const counts={all:0}; for(const ft of PLOTS.features){ const s=ft.properties.sector; counts[s]=(counts[s]||0)+1; counts.all++; }
  const el=document.getElementById("sectorChips"); const order=["all","North","South","Central","East","West"];
  el.innerHTML = order.filter(s=>s==="all"||counts[s]).map(s=>{
    const lbl = s==="all" ? "الكل" : SECTORS[s];
    return `<div class="chip ${s==="all"?"on":""}" data-sector="${s}">${lbl} <span style="opacity:.7;font-family:var(--kec-mono)">${counts[s]||0}</span></div>`;
  }).join("");
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    state.sector=c.dataset.sector; el.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); c.classList.add("on"); applyFilter();
  });
  document.getElementById("sectorMini").textContent = counts.all+" بلوت";
}
function buildLegend(){
  const counts={}; for(const ft of PLOTS.features){ counts[ft.properties.land_use]=(counts[ft.properties.land_use]||0)+1; }
  const el=document.getElementById("legend");
  el.innerHTML = Object.keys(LU).filter(k=>counts[k]).sort((a,b)=>counts[b]-counts[a]).map(k=>
    `<div class="lg" data-use="${encodeURIComponent(k)}"><span class="sw" style="background:${LU[k].c}"></span><span class="nm">${LU[k].ar}</span><span class="ct">${counts[k]}</span></div>`
  ).join("");
  el.querySelectorAll(".lg").forEach(row=>row.onclick=()=>{
    const k=decodeURIComponent(row.dataset.use);
    if(state.uses.has(k)){ state.uses.delete(k); row.classList.add("off"); } else { state.uses.add(k); row.classList.remove("off"); }
    applyFilter();
  });
}

/* ---- Detail panel ---- */
let selected=null;
function showDetail(p){
  selected=p.code;
  map.setFilter("plots-sel",["==","code",p.code]);
  const lu=LU[p.land_use]||{ar:p.land_use||"—",c:LU_FALLBACK};
  const cell=(l,v,sm)=>`<div class="d-cell"><div class="l">${l}</div><div class="v ${sm?'sm':''}">${v}</div></div>`;
  const num=(v,d=0)=> (v||v===0) ? new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(v) : "—";
  const d=document.getElementById("detail");
  d.innerHTML = `
    <div class="d-head">
      <button class="d-close" onclick="clearSel()">×</button>
      <div class="code">${p.code||"—"}</div>
      <div class="lu"><span class="dot" style="background:${lu.c}"></span>${lu.ar}</div>
    </div>
    <div class="d-body">
      <div class="d-grid">
        ${cell("القطاع", SECTORS[p.sector]||p.sector||"—", true)}
        ${cell("الأدوار", num(p.floors))}
        ${cell("المساحة (م²)", num(p.area,2))}
        ${cell("المسطح الإجمالي GFA (م²)", num(p.gfa,1))}
        ${cell("الارتفاع (م)", num(p.height))}
        ${cell("نسبة التغطية", p.coverage!=null?num(p.coverage,2):"—")}
        ${cell("معامل الاستغلال FAR", p.far!=null?num(p.far,2):"—")}
        ${cell("الاستخدام", lu.ar, true)}
      </div>
      <div class="d-actions">
        <button class="btn primary" onclick="flyTo('${p.code}')">تكبير للبلوت ⤢</button>
        <button class="btn" disabled title="متاح في النسخة الكاملة">إعادة تسمية ✎</button>
      </div>
      <div class="note">الإدارة الكاملة (تعديل، إعادة تسمية، تعديل المضلع) متاحة في نسخة المنصة الكاملة</div>
    </div>`;
  d.classList.add("show");
}
function clearSel(){ selected=null; map.setFilter("plots-sel",["==","code",""]); document.getElementById("detail").classList.remove("show"); }
window.clearSel=clearSel;

const featByCode={}; for(const ft of PLOTS.features){ featByCode[ft.properties.code]=ft; }
function flyTo(code){
  const ft=featByCode[code]; if(!ft) return;
  const ring = ft.geometry.type==="Polygon"?ft.geometry.coordinates[0]:ft.geometry.coordinates[0][0];
  const b=new maplibregl.LngLatBounds(); ring.forEach(pt=>b.extend(pt));
  map.fitBounds(b,{padding:{top:100,bottom:100,left:360,right:320},maxZoom:18,duration:800});
}
window.flyTo=flyTo;

/* ---- Interactions ---- */
let hovered=null;
map.on("load",()=>{
  buildSectors(); buildLegend(); updateKpis();
  map.fitBounds(BOUNDS,{padding:40,duration:0});
  document.getElementById("load").style.display="none";

  const tip=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:8});
  map.on("mousemove","plots-fill",(e)=>{
    map.getCanvas().style.cursor="pointer";
    const f=e.features[0]; const p=f.properties;
    if(hovered!==null) map.setFeatureState({source:"plots",id:hovered},{hover:false});
    hovered=p.code; map.setFeatureState({source:"plots",id:hovered},{hover:true});
    const lu=LU[p.land_use]||{ar:p.land_use};
    tip.setLngLat(e.lngLat).setHTML(`<div class="tip"><b>${p.code}</b><span>${lu.ar||"—"}</span></div>`).addTo(map);
  });
  map.on("mouseleave","plots-fill",()=>{
    map.getCanvas().style.cursor=""; tip.remove();
    if(hovered!==null) map.setFeatureState({source:"plots",id:hovered},{hover:false}); hovered=null;
  });
  map.on("click","plots-fill",(e)=>showDetail(e.features[0].properties));
});

/* ---- Top bar controls ---- */
document.getElementById("basemapSeg").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#basemapSeg button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  const sat = b.dataset.base==="satellite";
  map.setLayoutProperty("base-sat","visibility",sat?"visible":"none");
  map.setLayoutProperty("base-light","visibility",sat?"none":"visible");
  // brighter outlines/labels on satellite
  map.setPaintProperty("plots-line","line-color", sat?"#FBFCFA":"#143D1E");
  map.setPaintProperty("plots-line","line-opacity", sat?0.8:0.55);
  map.setPaintProperty("plots-label","text-color", sat?"#FFFFFF":"#143D1E");
  map.setPaintProperty("plots-label","text-halo-color", sat?"#143D1E":"#FBFCFA");
  map.setPaintProperty("plots-fill","fill-opacity",["case",["boolean",["feature-state","hover"],false], sat?0.85:0.92, sat?0.5:0.66]);
});
document.getElementById("dimSeg").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b)return;
  document.querySelectorAll("#dimSeg button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  const is3d = b.dataset.dim==="3d";
  map.setLayoutProperty("plots-3d","visibility",is3d?"visible":"none");
  map.setLayoutProperty("plots-fill","visibility",is3d?"none":"visible");
  map.easeTo({pitch:is3d?55:0, bearing:is3d?-18:-8, duration:700});
});
document.getElementById("resetBtn").addEventListener("click",()=>{
  clearSel();
  state.sector="all"; state.uses=new Set(Object.keys(LU)); state.search="";
  document.getElementById("searchInput").value="";
  buildSectors(); document.querySelectorAll("#legend .lg").forEach(x=>x.classList.remove("off"));
  applyFilter();
  map.easeTo({pitch:0,bearing:-8,duration:600}); map.fitBounds(BOUNDS,{padding:40,duration:700});
});
let sT; document.getElementById("searchInput").addEventListener("input",(e)=>{
  clearTimeout(sT); sT=setTimeout(()=>{
    state.search=e.target.value.trim(); applyFilter();
    if(state.search){ const hit=PLOTS.features.find(f=>(f.properties.code||"").toUpperCase()===state.search.toUpperCase());
      if(hit){ showDetail(hit.properties); flyTo(hit.properties.code); } }
  },220);
});
</script>
</body>
</html>
