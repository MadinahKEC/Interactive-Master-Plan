<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>مدينة المعرفة الاقتصادية — المخطط العام التفاعلي</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2F6B3E" />
    <link rel="apple-touch-icon" href="./KEC.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KEC Plan" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200..700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Boot splash: branded loading shown from the very first frame until React mounts,
         so entering the site feels like opening an app rather than a blank flash. -->
    <style>
      #boot{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:18px;background:#FBFCFA;
        transition:opacity .35s ease}
      #boot.boot--gone{opacity:0;pointer-events:none}
      #boot img{height:66px;width:auto;animation:bootpulse 1.8s ease-in-out infinite}
      #boot .boot-ring{width:34px;height:34px;border-radius:50%;
        border:3px solid #EAF3E4;border-top-color:#2F6B3E;animation:bootspin .9s linear infinite}
      @keyframes bootspin{to{transform:rotate(360deg)}}
      @keyframes bootpulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
      @media (prefers-color-scheme:dark){#boot{background:#0F1F15}#boot .boot-ring{border-color:#274031;border-top-color:#3E8E4F}}
    </style>
    <div id="boot">
      <img src="./KEC.png" alt="Knowledge Economic City" onerror="this.style.display='none'" />
      <div class="boot-ring"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
